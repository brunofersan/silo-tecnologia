<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Aprovar pedido | Silo IDE</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pedido.css?v=1">
</head>
<body>
  <div class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html" aria-label="Silo Tecnologia">
        <img src="assets/marca.png" alt="" width="36" height="36">
        <span><strong>Silo</strong> Tecnologia</span>
      </a>
    </div>
  </div>
  <main class="wrap">
    <div class="card">
      <h1 id="title">Pedido de download</h1>
      <p id="status" class="muted">Carregando pedido...</p>
      <dl class="summary" id="summary" hidden>
        <dt>Chave</dt><dd id="fKey"></dd>
        <dt>Nome</dt><dd id="fName"></dd>
        <dt>E-mail</dt><dd id="fEmail"></dd>
        <dt>Sistema</dt><dd id="fPlatform"></dd>
        <dt>Status</dt><dd id="fStatus"></dd>
      </dl>
      <div class="actions" id="actions" hidden>
        <button class="btn" id="go" type="button"></button>
      </div>
    </div>
  </main>
  <script src="config.js?v=2.0.0-11"></script>
  <script>
  (function () {
    var url = ((window.SILO_CONFIG || {}).DOWNLOAD_REQUEST_URL || "").trim();
    var q = new URLSearchParams(location.search);
    var acao = q.get("acao") === "recusar" ? "recusar" : "aprovar";
    var chave = q.get("chave") || "";
    var sig = q.get("sig") || "";
    var statusEl = document.getElementById("status");
    var btn = document.getElementById("go");
    var verb = acao === "aprovar" ? "Aprovar" : "Recusar";
    document.getElementById("title").textContent = verb + " pedido de download";
    btn.textContent = verb + " este pedido";
    btn.className = "btn " + (acao === "aprovar" ? "btn-primary" : "btn-danger");
    function msg(text, cls) { statusEl.textContent = text; statusEl.className = cls || "muted"; }
    function show(info) {
      document.getElementById("summary").hidden = false;
      document.getElementById("fKey").textContent = info.key;
      document.getElementById("fName").textContent = info.name;
      document.getElementById("fEmail").textContent = info.email;
      document.getElementById("fPlatform").textContent = info.platform;
      document.getElementById("fStatus").textContent = info.status;
    }
    function post(data) {
      return fetch(url, { method: "POST", body: JSON.stringify(data) }).then(function (r) { return r.json(); });
    }
    function fail(res) {
      msg(res && res.error === "notfound" ? "Pedido não encontrado na planilha." : res && res.error === "invalid" ? "Link de aprovação inválido. Use o link do e-mail do pedido." : "Não foi possível falar com o serviço agora. Tente de novo em alguns minutos.", "err");
    }
    if (!url || !chave || !sig) { fail({ error: "invalid" }); return; }
    post({ acao: "ver", para: acao, chave: chave, sig: sig }).then(function (res) {
      if (!res.ok) { fail(res); return; }
      show(res);
      msg(res.status === "pendente" ? "Confira os dados e confirme." : "Este pedido já foi " + res.status + ". Você pode " + verb.toLowerCase() + " de novo" + (acao === "aprovar" ? " para reenviar um link novo." : "."), "muted");
      document.getElementById("actions").hidden = false;
    }).catch(function () { fail(null); });
    btn.addEventListener("click", function () {
      btn.disabled = true;
      msg(acao === "aprovar" ? "Aprovando e enviando o e-mail..." : "Recusando...", "muted");
      post({ acao: acao, chave: chave, sig: sig }).then(function (res) {
        if (!res.ok) { fail(res); btn.disabled = false; return; }
        show(res);
        document.getElementById("actions").hidden = true;
        msg(acao === "aprovar" ? "Aprovado. O link foi enviado para " + res.email + " e vale até " + res.until + "." : "Recusado. Nenhum e-mail foi enviado para a pessoa.", "ok");
      }).catch(function () { fail(null); btn.disabled = false; });
    });
  })();
  </script>
</body>
</html>
